name: cyber-audit-system

services:
  # 1. Local Hardhat Blockchain Node (Isolated port 8545)
  hardhat-node:
    image: node:24-alpine
    container_name: cyber_audit_evm
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "${RPC_PORT:-8545}:8545"
    command: sh -c "npm ci && npx hardhat node --hostname 0.0.0.0"
    healthcheck:
      # node is guaranteed in this image; nc is missing from node:24-alpine
      # and "localhost" can resolve to ::1 (IPv6) while hardhat binds IPv4.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8545',{timeout:2000},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - cyber_audit_isolated_net

  # 2. Automated Contract Deployment & Bootstrap
  contract-deployer:
    image: node:24-alpine
    container_name: cyber_audit_deployer
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - BLOCKCHAIN_RPC_URL=http://hardhat-node:8545
      # hardhat.config.js's "localhost" network reads LOCALHOST_RPC_URL —
      # without it hardhat dials 127.0.0.1:8545 INSIDE this container (dead).
      - LOCALHOST_RPC_URL=http://hardhat-node:8545
      - INSTITUTION_ID=INST-CENTRAL-DEMO
    # The anonymous node_modules volume starts EMPTY: npx must resolve hardhat
    # from a populated local node_modules (pinned by the root package-lock.json
    # to hardhat 2.x) or it downloads hardhat 3.x and fails with HHE22
    # (non-local installation). npm ci MUST run before npx.
    command: sh -c "npm ci && npx hardhat run scripts/deploy.js --network localhost"
    depends_on:
      hardhat-node:
        condition: service_healthy
    networks:
      - cyber_audit_isolated_net

  # 3a. One-shot schema migration (R11: migrations own the PostgreSQL schema —
  # the engine NEVER runs create_all on PostgreSQL). Fresh demo volumes start
  # with NO tables; the engine swallows that startup failure as a "note" and
  # readiness stays 503, so the schema MUST be migrated before the engine boots.
  db-migrate:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    image: cyber-audit-ai-engine:demo
    container_name: cyber_audit_db_migrate
    environment:
      - MIGRATION_DATABASE_URL=postgresql+psycopg://audit_admin:audit_admin_secret@postgres:5432/cyber_audit
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cyber_audit_isolated_net

  # 3b. One-shot demo seed: the institutions row for the demo tenant
  # (INST-CENTRAL-DEMO). The engine's built-in demo seed is confined to the
  # SQLite dev path (R11); on PostgreSQL demo the FK target must be seeded
  # explicitly. Idempotent: inserts only when missing.
  db-seed:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    image: cyber-audit-ai-engine:demo
    container_name: cyber_audit_db_seed
    environment:
      - DATABASE_URL=postgresql+psycopg://audit_admin:audit_admin_secret@postgres:5432/cyber_audit
      - INSTITUTION_ID=INST-CENTRAL-DEMO
    command: ["python", "scripts/demo_seed.py"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - cyber_audit_isolated_net

  # 3. Python FastAPI AI Engine (Isolated port 8005)
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    image: cyber-audit-ai-engine:demo
    container_name: cyber_audit_ai
    ports:
      - "${AI_PORT:-8005}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - BLOCKCHAIN_RPC_URL=http://hardhat-node:8545
      - INSTITUTION_ID=INST-CENTRAL-DEMO
      - LARGE_TRANSACTION_THRESHOLD=10.0
      - DAILY_VOLUME_LIMIT=50.0
      - MAX_WARNING_OVERRIDES=5
      - MAX_AFTER_HOURS_ACTIONS=3
      - MAX_BENEFICIARY_REPEAT=10
      - MIN_DECISION_TIME_SECONDS=10.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=postgresql+psycopg://audit_admin:audit_admin_secret@postgres:5432/cyber_audit
      - EVIDENCE_STORE_PATH=/app/data/evidence
    depends_on:
      hardhat-node:
        condition: service_healthy
      contract-deployer:
        condition: service_completed_successfully
      db-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - cyber_audit_isolated_net

  # 4. Multi-Tenant Relational Database (PostgreSQL 16 with RLS support)
  postgres:
    image: postgres:16-alpine
    container_name: cyber_audit_postgres
    environment:
      POSTGRES_DB: cyber_audit
      POSTGRES_USER: audit_admin
      POSTGRES_PASSWORD: audit_admin_secret
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_admin -d cyber_audit"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cyber_audit_isolated_net

  # 5. React + Vite Cyber-Auditing Dashboard (Isolated port 3005)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyber_audit_frontend
    ports:
      - "${FRONTEND_PORT:-3005}:3000"
    environment:
      - VITE_AI_ENGINE_URL=/api
      - VITE_RPC_URL=http://localhost:${RPC_PORT:-8545}
    depends_on:
      ai-engine:
        condition: service_healthy
    networks:
      - cyber_audit_isolated_net

volumes:
  postgres_data:

networks:
  cyber_audit_isolated_net:
    name: cyber_audit_isolated_net
    driver: bridge

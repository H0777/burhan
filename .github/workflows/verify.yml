name: Verification & Quality Gates (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-contracts:
    name: EVM Contracts & Governance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Compile Contracts
        run: npx hardhat compile

      - name: Check Contract ABI Drift
        run: npm run contracts:check

      - name: Run Contract Test Suite
        run: npx hardhat test

      - name: Test Ephemeral Deployment & Phased Bootstrap
        run: npx hardhat run scripts/deploy.js --network hardhat

  verify-api:
    name: Python AI Engine & API V2 Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r ai-engine/requirements.txt

      - name: Check OpenAPI V2 Contract Drift
        run: python scripts/check-openapi.py

      - name: Run Shared Tri-Language Node Hash Tests
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && node --test shared/tests/evidence-hash.test.mjs shared/tests/currency.test.mjs

      - name: Run Pytest Suite
        env:
          PYTHONPATH: ./ai-engine
        run: pytest -q ai-engine/tests

  verify-frontend:
    name: Frontend React, Lint & Build Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # jsdom 30 + undici 8 (its fetch stack) require Node >= 24; Node 20
      # crashed vitest at import time. Keep this in lockstep with the
      # development environment that generates frontend/package-lock.json.
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: ESLint Flat Config Lint Check
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest Suite
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build

  verify-deployment-smoke:
    name: Local Node Smoke & Verification Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Start Local Hardhat Node (Background)
        run: |
          npx hardhat node --hostname 127.0.0.1 > /dev/null 2>&1 &
          sleep 5

      - name: Run Deployment & Bootstrap
        run: npx hardhat run scripts/deploy.js --network localhost

      - name: Verify Live Deployment Invariants
        run: node scripts/verify-deployment.js

  secret-and-quality-audit:
    name: Secret Hygiene & Artifact Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for Tracked Secret Files
        run: |
          if git ls-files | grep -E '(\.env$|\.env\.local$|\.pem$|\.key$)'; then
            echo "ERROR: Unencrypted secrets or private keys tracked in Git index!"
            exit 1
          fi
          echo "No tracked secret files found."

  # H03 SCA gate. Audits production dependency surfaces only (--omit=dev).
  # Fail policy: the job FAILS only on CRITICAL-severity findings
  # (npm --audit-level=critical; pip-audit + scripts/sca-pip-severity-filter.py).
  # High/Moderate/Low findings are printed to the job log but do not fail CI.
  # Both npm audits run straight off the lockfiles — no node_modules or
  # npm ci needed (npm audit resolves the tree from package-lock.json).
  # Full rationale and local scan evidence: docs/verification/program/sca-h03.md
  sca-dependency-scan:
    name: SCA Dependency Vulnerability Gate (fail on Critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24 (npm registry cache)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Audit Root Node Dependencies (production surface)
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit Frontend Node Dependencies (production surface)
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Setup Python 3.11 (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install pip-audit (version pinned for reproducible gate)
        run: |
          pip install --upgrade pip
          pip install pip-audit==2.10.1

      - name: Audit Python Dependencies (full resolution; fail on CRITICAL only)
        run: |
          set +e
          pip-audit -r ai-engine/requirements.txt --strict --format json \
            --output "$RUNNER_TEMP/sca-pip-audit.json" --progress-spinner off
          PIP_EXIT=$?
          set -e
          echo "pip-audit exit code: $PIP_EXIT (non-zero means findings OR resolution error; severity policy is applied by the filter below)"
          if [ ! -s "$RUNNER_TEMP/sca-pip-audit.json" ]; then
            echo "SCA GATE ERROR: pip-audit produced no report — resolution failed (--strict) or the tool errored. Gate cannot attest; investigate the log above."
            exit 2
          fi
          python scripts/sca-pip-severity-filter.py "$RUNNER_TEMP/sca-pip-audit.json"

  verify-integration:
    name: Full Trust Flow E2E Integration Gate
    runs-on: ubuntu-latest
    needs: [verify-contracts, verify-api]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r ai-engine/requirements.txt

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run E2E Trust Flow Integration Suite
        run: npm run test:integration


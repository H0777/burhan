[alembic]
# R11 migration conventions (binding for every later revision):
#   * script_location points into the app package so migrations ship with the code.
#   * The database URL is NEVER stored here. Migrations read MIGRATION_DATABASE_URL
#     (the dedicated migration/owner role) at runtime; alembic.ini carries no secrets.
#   * Every revision gets a unique descriptive slug (e.g. r11_baseline) and its
#     down_revision must point at the current HEAD at merge time (see
#     docs/verification/remediation/R11.md). Never more than one head.
script_location = %(here)s/app/db/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
